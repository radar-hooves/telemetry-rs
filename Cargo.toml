[package]
name = "telemetry"
version = "0.5.0"
description = "The household's one Rust telemetry call: stderr for the developer, allow-listed OTLP/HTTP for the corpus"
authors = ["poodle64"]
license = "MIT"
edition = "2024"
rust-version = "1.87"
publish = false

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["logs", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "http-proto",
  "logs",
  "trace",
  "reqwest-blocking-client",
] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-http = { version = "0.32", features = ["reqwest-blocking"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic-messages",
  "logs",
] }
prost = "0.14"
tracing-opentelemetry = "0.33"

async-trait = "0.1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rustls only — native-tls/openssl must not arrive through this crate. Not the
# `rustls` feature: that is `__rustls-aws-lc-rs`, and aws-lc-sys fails to build
# under thoth's `-march=armv8-a` CI flags, so a shared crate must not force it
# into a consumer's graph. `rustls-no-provider` brings rustls plus the platform
# certificate verifier; `init` installs ring as the process provider if the app
# has not already installed one.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
reqwest-middleware = "0.5"
reqwest-tracing = { version = "0.7", features = ["opentelemetry_0_32"] }

# The process sampler's own timer; it spawns nothing itself (see process.rs),
# so "rt" is the caller's concern, never this crate's.
tokio = { version = "1", features = ["time"] }
# RSS and CPU for the process sampler, cross-platform (macOS/Linux/Windows —
# the whole desktop fleet this crate serves).
sysinfo = "0.33"

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", features = ["logs", "trace", "testing"] }
serial_test = "4"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
