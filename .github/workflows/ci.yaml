name: CI

# The one fast gate on every push to main and every PR: format, clippy, test.
# A library with no platform-specific code, so one target is the whole matrix.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yaml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    # by-exception (2026-09-07, updated 09/09/2026): the radar-hooves org now
    # runs 9 online self-hosted runners registered at the ORG level
    # (atlas-1..8, huginn — `gh api orgs/radar-hooves/actions/runners`), so a
    # `self-hosted` job here would no longer queue forever for want of a
    # runner. This repo stays on ubuntu-latest anyway: it is PUBLIC, so
    # vendor-hosted minutes are unbilled, and atlas's runners carry no
    # ambient Rust toolchain — the household's Rust-on-atlas pattern needs a
    # flake devShell this crate does not have. Move to `[self-hosted, atlas]`
    # once this crate gets one.
    runs-on: ubuntu-latest # by-exception (2026-09-08): a public crate with no flake, and the household runner carries no ambient Rust toolchain
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Notify failure (ntfy infra)
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # This repo is PUBLIC and radar-hooves/master-project is private, so the
          # ntfy-failure composite action cannot be resolved at job-setup time;
          # the household CI standard has a public repo inline the curl.
          if [ -z "$NTFY_TOKEN" ]; then
            echo "::warning::ntfy-failure: no NTFY_TOKEN secret — notification NOT sent"
            exit 0
          fi
          curl -sS --max-time 10 \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: telemetry: rust CI failed" \
            -H "Priority: 4" \
            -H "Tags: rotating_light" \
            -d "Run: $RUN_URL" \
            "https://ntfy.godswood.au/infra" \
            || echo "::warning::ntfy notify POST failed"
